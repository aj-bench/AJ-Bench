[project]
authors = []
name = "MCPMark"
requires-python = ">=3.11,<3.12"
version = "0.0.1"
dependencies = [
  "notion-client==2.4.0",
  "playwright>=1.49.0",
  "seaborn>=0.12.0",
  "matplotlib>=3.7.0",
  "numpy>=1.23.0",
  "openai-agents>=0.2.3,<0.3",
  "openai>=1.96.1",
  "python-dotenv>=1.1.1,<2",
  "ruff>=0.12.4,<0.13",
  "psycopg2-binary>=2.9.10,<3",
  "pyyaml>=6.0.2,<7",
  "nest-asyncio>=1.6.0,<2",
  "pixi",
  "pipx>=1.7.1,<2",
  "pgdumplib>=3.1.0,<4",
  "litellm==1.80.0",
  "transformers==4.56.2",
  "requests==2.32.5",
  "pandas>=2.0.0",
  "Pillow>=10.1.0",
  "boto3>=1.26.0",
  "gymnasium>=0.29.0",
  "mcp>=1.0.0",
  "httpx>=0.27.0",
  "pydrive>=1.3.1",
  "requests-toolbelt>=1.0.0",
  "lxml>=4.9.0",
  "cssselect>=1.2.0",
  "rapidfuzz>=3.9.0",
  "PyMuPDF>=1.23.0",
  "imagehash>=4.3.1",
  "borb>=2.1.25",
  "beautifulsoup4>=4.12.0",
  "formulas>=1.2.6",
  "xmltodict>=0.13.0",
  "openpyxl>=3.1.0",
  "tldextract>=5.1.0",
  "easyocr>=1.7.1",
  "python-docx>=0.8.11",
  "odfpy>=1.4.1",
  "scikit-image>=0.22.0",
  "pdfplumber>=0.11.0",
  "mutagen>=1.46.0",
  "pypdf>=5.1.0",
  "python-pptx>=0.6.23",
  "pyacoustid>=1.3.0,<1.4",
  "opencv-python>=4.9.0",
  "librosa>=0.10.2",
  "fastdtw>=0.3.4",
  "scipy>=1.11.0",
  "PyPDF2>=3.0.0",
  "tiktoken>=0.7.0",
  "pytz>=2023.3",
]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = [
  "osx-arm64",
  "linux-aarch64",
  "linux-64",
  "win-64",
  "osx-64",
]

[tool.pixi.tasks]
fmt = "ruff"

[tool.ruff.format]
indent-style = "space"
line-ending = "auto"

[tool.hatch.build.targets.wheel]
packages = ["src", "tasks"]
